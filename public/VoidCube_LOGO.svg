<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
    <defs>
        <linearGradient id="top" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#42a472"/>
            <stop offset="45%" stop-color="#57c785"/>
            <stop offset="100%" stop-color="#80d5d4"/>
        </linearGradient>

        <linearGradient id="left" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#57c785"/>
            <stop offset="45%" stop-color="#42a472"/>
            <stop offset="100%" stop-color="#003737"/>
        </linearGradient>

        <linearGradient id="right" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#80d5d4"/>
            <stop offset="45%" stop-color="#57c785"/>
            <stop offset="100%" stop-color="#185e4c"/>
        </linearGradient>
    </defs>

    <!-- Face superior -->
    <polygon
        points="500,200 759.808,350 500,500 240.192,350"
        fill="url(#top)"
    />

    <!-- Face esquerda -->
    <polygon
        points="240.192,350 500,500 500,800 240.192,650"
        fill="url(#left)"
    />

    <!-- Face direita -->
    <polygon
        points="500,500 759.808,350 759.808,650 500,800"
        fill="url(#right)"
    />

    <!-- Contorno -->
    <path
        d="M500 200
           L759.808 350
           L759.808 650
           L500 800
           L240.192 650
           L240.192 350
           Z
           M500 500
           L500 800
           M240.192 350
           L500 500
           L759.808 350"
        fill="none"
        stroke="#1c2224"
        stroke-width="16"
        stroke-linejoin="round"
        stroke-linecap="round"
    />
</svg>